<!DOCTYPE html>
<html>
<head>
    <title>Number Plate Detector</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #e9ecef;
        }

        /* Navbar */
        .navbar {
            background: linear-gradient(90deg, #0d6efd, #6610f2);
            color: white;
            padding: 15px 30px;
            text-align: left;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        /* Layout */
        .layout {
            display: flex;
            flex: 1;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background-color: #343a40;
            color: white;
            padding: 25px 20px;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.15);
            border-top-right-radius: 12px;
        }

        .sidebar h3 {
            color: #adb5bd;
            margin-bottom: 30px;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .sidebar a {
            display: block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #dee2e6;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .sidebar a:hover {
            background-color: #495057;
            color: #fff;
        }

        /* Content Area */
        .content {
            flex: 1;
            padding: 40px;
            background-color: #f8f9fa;
            border-top-left-radius: 12px;
            min-height: 100%;
        }

        /* Optional: Add a card-style wrapper to content blocks */
        .card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="navbar">
        🚘 Number Plate Detection System
    </div>

    <div class="layout">
        <div class="sidebar">
            <h3>Navigation</h3>
            <a href="/">🏠 Home</a>
            <a href="/predict">📸 Predict</a>
            <!-- You can add more links like: -->
            <!-- <a href="/about">ℹ️ About</a> -->
        </div>

        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
